[pytest]
# The suite is roughly two different things sharing a directory. Most of it is
# fast checks against a freshly built world; a couple of dozen are soak tests
# that run a village for a month of simulated time. The soak tests are 70% of
# the wall clock, so they are marked and excluded from the everyday run:
#
#   pytest tests/ -m "not slow"     # ~7 min, what to run while refactoring
#   pytest tests/                   # ~22 min, the full suite
#   pytest tests/ -m slow           # just the soak tests
#
# Mark a whole module with `pytestmark = pytest.mark.slow` rather than tagging
# individual tests: the first test in a class is billed for the world its setUp
# builds, so per-test timings point at whichever test happened to run first.
markers =
    slow: long-running simulation soak test, excluded by -m "not slow"
